[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scrapy-stealth"
version = "0.6.8a1"
description = "Stealthy Crawling. Maximum Results. A pluggable anti-bot and stealth framework for Scrapy."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Fawad Ali", email = "fawadstar6@gmail.com" }
]
requires-python = ">=3.11"

dependencies = [
    "scrapy>=2.12.0,<3.0",
    "wreq>=0.11.2",
    "curl_cffi>=0.15.0",
    "nodriver>=0.50.3",
    "colorama>=0.4.6",
]

keywords = [
    "scrapy",
    "scrapy middleware",
    "web scraping",
    "stealth",
    "stealth crawler",
    "anti-bot",
    "anti-detection",
    "crawler",
    "spider",
    "browser fingerprint",
    "proxy rotation",
    "fingerprint",
    "cloudflare bypass",
    "http2",
    "tls fingerprint",
    "headless browser",
    "bot detection bypass",
    "rate limit bypass",
    "scraping framework",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Scrapy",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15.13",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[project.urls]
Homepage = "https://github.com/fawadss1/scrapy-stealth"
Repository = "https://github.com/fawadss1/scrapy-stealth"
Issues = "https://github.com/fawadss1/scrapy-stealth/issues"
Changelog = "https://github.com/fawadss1/scrapy-stealth/releases"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", ".venv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
ignore_missing_imports = true
no_site_packages = true
